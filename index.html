<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>그래 작은 도서관</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #faf6ef;
      --cream-dark: #f0e9dc;
      --sage: #7a9e7e;
      --sage-light: #a8c5ab;
      --sage-dark: #5a7e5e;
      --terracotta: #c1694f;
      --terracotta-light: #d98c78;
      --terracotta-dark: #a0503a;
      --text-dark: #3a2e28;
      --text-mid: #6b5a50;
      --text-light: #9e8878;
      --card-bg: #fffdf8;
      --shadow: 0 2px 12px rgba(58,46,40,0.08);
      --radius: 14px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Gowun Batang', serif; background-color: var(--cream); color: var(--text-dark); -webkit-tap-highlight-color: transparent; }

    header { position: sticky; top: 0; z-index: 100; background: var(--cream); border-bottom: 1.5px solid var(--cream-dark); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(58,46,40,0.06); }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--sage-light); }
    .header-title { display: flex; flex-direction: column; }
    .header-title .sub { font-size: 10px; color: var(--text-light); letter-spacing: 0.05em; }
    .header-title .main { font-size: 16px; font-weight: 700; color: var(--text-dark); line-height: 1.2; }
    .btn-admin { background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); }

    .search-wrap { padding: 14px 16px 10px; background: var(--cream); position: sticky; top: 65px; z-index: 90; border-bottom: 1px solid var(--cream-dark); }
    .search-row { display: flex; gap: 8px; align-items: center; }
    .search-input-wrap { flex: 1; position: relative; }
    .search-input { width: 100%; padding: 10px 14px 10px 38px; border: 1.5px solid var(--cream-dark); border-radius: 30px; font-family: 'Gowun Batang', serif; font-size: 15px; background: var(--card-bg); outline: none; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
    .btn-filter { flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--cream-dark); background: var(--card-bg); cursor: pointer; }
    .btn-filter.active { background: var(--sage); border-color: var(--sage); }

    .filter-panel { display: none; padding: 10px 0 0; }
    .filter-panel.open { display: block; }
    .filter-panel-inner { display: flex; gap: 8px; align-items: center; }
    .filter-search-wrap { flex: 1; position: relative; }
    .filter-input { width: 100%; padding: 9px 12px 9px 36px; border: 1.5px solid var(--cream-dark); border-radius: 30px; font-family: 'Gowun Batang', serif; font-size: 14px; background: var(--card-bg); }
    .filter-search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); }
    .filter-dropdowns { display: flex; gap: 6px; margin-top: 6px; }
    .kdc-label { font-size: 12px; color: var(--text-light); margin: 10px 0 6px; }
    .kdc-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .kdc-btn { border: none; border-radius: 10px; padding: 7px 4px; cursor: pointer; background: var(--cream-dark); color: var(--text-mid); font-family: 'Gowun Batang', serif; }
    .kdc-btn.active { color: white; }
    select.filter-select { flex: 1; padding: 8px 10px; border: 1.5px solid var(--cream-dark); border-radius: 20px; font-family: 'Gowun Batang', serif; cursor: pointer; }
    .btn-filter-search { flex-shrink: 0; padding: 9px 14px; background: var(--sage); color: white; border: none; border-radius: 20px; cursor: pointer; }

    main { padding: 0 12px 160px; }
    .book-card { background: var(--card-bg); border-radius: var(--radius); padding: 13px 14px; margin-bottom: 8px; box-shadow: var(--shadow); }
    .book-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .book-meta { font-size: 12.5px; color: var(--text-light); margin-bottom: 6px; }
    .book-call-number { background: rgba(193,105,79,0.1); color: var(--terracotta-dark); font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
    .book-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: rgba(122,158,126,0.12); color: var(--sage-dark); font-weight: 700; }

    footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--cream); border-top: 1.5px solid var(--cream-dark); padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; }
    .btn-request { background: var(--terracotta); color: white; border: none; border-radius: 30px; padding: 12px 32px; font-family: 'Gowun Batang', serif; cursor: pointer; width: 100%; max-width: 400px; }
    .btn-band { display: flex; align-items: center; gap: 8px; background: #00c73c; color: white; border-radius: 30px; padding: 10px 20px; width: 100%; max-width: 400px; margin-bottom: 8px; text-decoration: none; justify-content: center; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(58,46,40,0.45); z-index: 300; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-sheet { background: var(--cream); border-radius: 24px 24px 0 0; width: 100%; max-width: 600px; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto; }
    .req-result { margin-top: 10px; padding: 10px; border-radius: 8px; display: none; }
    .req-result.found { background: #fce8e6; color: #a0503a; display: block; }
    .req-result.not-found { background: #e8f5e9; color: #5a7e5e; display: block; }
    .found-list { max-height: 250px; overflow-y: auto; margin-top: 10px; }
    .found-item { padding: 8px 0; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-title">
      <span class="sub">작은 도서관</span>
      <span class="main">그래 작은 도서관</span>
    </div>
  </div>
  <button class="btn-admin" onclick="openAdminModal()">⚙️</button>
</header>

<div class="search-wrap">
  <div class="search-row" id="basic-search-row">
    <div class="search-input-wrap">
      <input type="search" class="search-input" id="main-search" placeholder="책 제목 또는 저자 검색" oninput="onMainSearch()" />
    </div>
    <button class="btn-filter" id="btn-filter" onclick="toggleFilter()">🎛️</button>
  </div>
  <div class="filter-panel" id="filter-panel">
    <div class="filter-panel-inner">
      <input type="search" class="filter-input" id="filter-input" placeholder="상세 검색" />
      <button class="btn-filter-search" onclick="runFilter()">검색</button>
    </div>
    <div class="filter-dropdowns">
      <select class="filter-select" id="filter-audience" onchange="runFilter()">
        <option value="">모든 대상</option>
        <option value="유아">유아</option><option value="어린이">어린이</option><option value="청소년">청소년</option><option value="성인">성인</option><option value="만화">만화</option>
      </select>
      <select class="filter-select" id="filter-sort" onchange="runFilter()">
        <option value="recent">최신 등록순</option>
        <option value="alpha">가나다순</option>
        <option value="callno">청구기호순</option>
      </select>
    </div>
  </div>
</div>

<main id="book-list"></main>

<footer>
  <a class="btn-band" href="https://band.us/@graelib" target="_blank">네이버 밴드</a>
  <button class="btn-request" onclick="openRequestModal()">📬 없는 책 신청하기</button>
</footer>

<div class="modal-overlay" id="request-modal" onclick="closeModalOnBg(event,'request-modal')">
  <div class="modal-sheet">
    <div class="modal-title" style="margin-bottom:15px;">📬 희망 도서 신청</div>
    <input type="text" class="req-input" id="req-input" placeholder="책 제목을 입력하세요" style="width:100%; padding:10px; margin-bottom:10px; border-radius:20px; border:1px solid #ccc;"/>
    <button class="btn-request" onclick="checkDuplicate()">중복 확인</button>
    <div class="req-result" id="req-result"></div>
    <button class="btn-request" id="btn-go-request" style="margin-top:10px; display:none;" onclick="window.open('https://forms.gle/VZZNRDchkFnrXEjo8')">신청서 작성하기</button>
  </div>
</div>

<script>
// 데이터 및 로직은 기존과 동일하나 검색/정렬 함수를 보강함
let allBooks = []; 
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9wF1ojhJI8CwEpJPjk3xkUiOB5gxTpFtsaKGZ08j-kvksuv9NzJSl_GEp01J15W4uSzRkOUF_P4QP/pub?gid=1825971218&single=true&output=csv';

async function loadBooks() {
    const res = await fetch(CSV_URL);
    const text = await res.text();
    // 데이터 파싱 로직은 기존 코드 사용 (생략)
    // ... [중략]
}

// 1번 문제 해결: 공백 제거 후 비교
function isMatch(text, query) {
    const cleanText = text.replace(/\s+/g, '').toLowerCase();
    const cleanQuery = query.replace(/\s+/g, '').toLowerCase();
    return cleanText.includes(cleanQuery);
}

// 정렬 및 검색 통합 함수 (청구기호순 포함)
function sortBooks(books, type) {
    if (type === 'alpha') return books.sort((a, b) => a.title.localeCompare(b.title, 'ko'));
    if (type === 'callno') return books.sort((a, b) => a.callNum.localeCompare(b.callNum));
    return books.sort((a, b) => (b.regDate || 0) - (a.regDate || 0));
}

// 3번 문제 해결: 정확도 우선 정렬
function checkDuplicate() {
    const q = document.getElementById('req-input').value.trim();
    const found = allBooks.filter(b => isMatch(b.title, q));
    
    // 제목이 완전히 일치하는 것을 먼저 보이게 정렬
    found.sort((a, b) => {
        const aFull = a.title.replace(/\s/g, '').toLowerCase();
        const bFull = b.title.replace(/\s/g, '').toLowerCase();
        const qClean = q.replace(/\s/g, '').toLowerCase();
        if (aFull === qClean) return -1;
        if (bFull === qClean) return 1;
        return 0;
    });

    const resultEl = document.getElementById('req-result');
    if (found.length > 0) {
        resultEl.className = 'req-result found';
        resultEl.innerHTML = `<strong>${found.length}권</strong>의 유사 도서가 있습니다:<div class="found-list">` + 
            found.map(b => `<div class="found-item">${b.title} (${b.callNum})</div>`).join('') + `</div>`;
        document.getElementById('btn-go-request').style.display = 'none';
    } else {
        resultEl.className = 'req-result not-found';
        resultEl.innerHTML = `✅ 도서관에 없는 책입니다! 신청해 주세요.`;
        document.getElementById('btn-go-request').style.display = 'block';
    }
}
// ... 나머지 함수는 기존 코드 유지
</script>
</body>
</html>
