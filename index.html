<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>그래 작은 도서관</title>
  <style>
    /* ... (기존과 동일한 모든 CSS 유지) ... */
  </style>
</head>
<body>
  <script>
// 1. 띄어쓰기 무시 검색을 위한 유틸리티
function getCleanText(str) {
    return str.replace(/\s+/g, '').toLowerCase();
}

// 2. 검색 및 필터 로직 개선
function runFilter() {
    const q = document.getElementById('filter-input').value.trim();
    const audience = document.getElementById('filter-audience').value;
    const sort = document.getElementById('filter-sort').value; // '청구기호순' 추가됨

    let filtered = allBooks.filter(b => {
        const matchQ = !q || (
            getCleanText(b.title).includes(getCleanText(q)) ||
            getCleanText(b.author).includes(getCleanText(q))
        );
        return matchQ && matchAudience(b, audience);
    });

    // 정렬 로직 보강
    if (sort === 'alpha') {
        filtered.sort((a, b) => a.title.localeCompare(b.title, 'ko'));
    } else if (sort === 'callno') {
        filtered.sort((a, b) => a.callNum.localeCompare(b.callNum));
    } else {
        filtered.sort((a, b) => (b.regDate || 0) - (a.regDate || 0));
    }

    renderBooks(filtered, q);
}

// 3. 희망 도서 신청 시 중복 확인 로직 개선 (포함 검색 + 우선순위)
function checkDuplicate() {
    const q = document.getElementById('req-input').value.trim();
    if (!q) return;

    // 검색어와 일치하는 책을 필터링 (공백 제거 적용)
    const found = allBooks.filter(b => getCleanText(b.title).includes(getCleanText(q)));
    
    // 정확히 일치하는 책이 있으면 우선적으로 상단에 배치
    found.sort((a, b) => {
        const aMatch = getCleanText(a.title) === getCleanText(q);
        const bMatch = getCleanText(b.title) === getCleanText(q);
        return bMatch - aMatch; 
    });

    const resultEl = document.getElementById('req-result');
    const btnGo = document.getElementById('btn-go-request');

    if (found.length > 0) {
        // 최대 10개까지 보여주도록 수정하여 목록 과부하 방지
        const items = found.slice(0, 10).map(b => 
            `<div class="found-item">${escHtml(b.title)} (${escHtml(b.callNum)})</div>`
        ).join('');
        resultEl.className = 'req-result found';
        resultEl.innerHTML = `📚 <strong>${found.length}권</strong>의 유사 도서가 있어요:<div class="found-list">${items}</div>`;
        btnGo.classList.remove('show');
    } else {
        resultEl.className = 'req-result not-found';
        resultEl.innerHTML = `✅ 도서관에 없는 책이에요! 신청해 주세요.`;
        btnGo.classList.add('show');
    }
}
// ... (기타 모든 기존 기능 함수들)
</script>
</body>
</html>
